name: carrierchaos

x-app-env: &app-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://carrierchaos:carrierchaos@postgres:5432/carrierchaos?connection_limit=20
  REDIS_URL: redis://redis:6379
  MOCK_CARRIER_URL: http://mock-carrier:4000
  ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carrierchaos
      POSTGRES_PASSWORD: carrierchaos
      POSTGRES_DB: carrierchaos
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carrierchaos -d carrierchaos']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # AOF persistence so queued/delayed jobs survive a Redis restart (see docs/delivery-guarantees.md).
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: carrierchaos:local
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  mock-carrier:
    image: carrierchaos:local
    command: ['node', 'dist/mock-carrier/main.js']
    environment: *app-env
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: carrierchaos:local
    command: ['node', 'dist/api/main.js']
    environment: *app-env
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-carrier:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    image: carrierchaos:local
    command: ['node', 'dist/worker/main.js']
    environment: *app-env
    ports:
      - '9464:9464'
    # Give in-flight jobs time to finish on `docker compose stop` (SIGTERM -> graceful drain).
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-carrier:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:9464/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
